packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
# LangGraph Studio 的本地服务（apps/agent-langchain 的 devDependency @langchain/langgraph-cli）声明的 peer 偏旧：
# 要 TypeScript 5、@hono/node-server 1.x，本仓库是 TypeScript 6、node-server 2.x。实测 langgraphjs dev 能正常启动和运行，只放行这两条
peerDependencyRules:
  allowedVersions:
    "@langchain/langgraph-api>typescript": "6"
    "@hono/node-ws>@hono/node-server": "2"
overrides:
  "@next/env": npm:@varlock/nextjs-integration@1.2.2
catalog:
  zod: ^4.5.4
  typescript: ^6.0.3
  "@types/node": ^26.4.1
  varlock: 1.18.0
  "@trpc/server": ^11.19.0
  better-auth: 1.7.10
  lucide-react: ^1.41.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  sonner: ^2.0.8
  "@trpc/client": ^11.19.0
  "@tailwindcss/postcss": ^4.3.3
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  tailwindcss: ^4.3.3
