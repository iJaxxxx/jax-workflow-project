name: CI

# push 到任意分支、以及发起 / 更新 PR 时运行：类型检查 + 代码风格检查
on:
  push:
  pull_request:

permissions:
  contents: read

# 同一个分支连续 push 时，取消还在跑的旧一次，只保留最新的
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # prisma.config.ts 读取 DATABASE_URL；prisma generate 只生成类型，不连数据库，随便给一个合法地址即可
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 版本取自 package.json 的 packageManager 字段（pnpm@12.15.0）
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # postinstall 会执行 varlock codegen，生成各包的 src/env.ts（不需要 .env）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 生成 Prisma Client（packages/db/prisma/generated，已被 git 忽略），check-types 依赖它
      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Type check
        run: pnpm check-types

      - name: Lint and format check
        run: pnpm check

  # 只在 push 到 master、且 check 通过后，构建 apps/web 并上传到 Cloudflare Pages
  deploy-web:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 部署不跟着 check 的 concurrency 取消，避免上传到一半被打断
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_SERVER_URL 在构建时写进前端代码，取自仓库的 Actions Variables
      - name: Build web (static export)
        run: pnpm -F web build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}

      # 项目名和上传目录取自 apps/web/wrangler.jsonc；项目不存在时先创建（直传类型）
      - name: Deploy to Cloudflare Pages
        working-directory: apps/web
        run: |
          if ! pnpm exec wrangler pages project list | grep -q "jax-workflow-web "; then
            pnpm exec wrangler pages project create jax-workflow-web --production-branch master
          fi
          pnpm exec wrangler pages deploy --branch master
