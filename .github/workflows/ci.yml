name: CI

# push 到任意分支、以及发起 / 更新 PR 时运行：类型检查 + 代码风格检查
on:
  push:
  pull_request:

permissions:
  contents: read

# 同一个分支连续 push 时，取消还在跑的旧一次，只保留最新的
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # prisma.config.ts 读取 DATABASE_URL；prisma generate 只生成类型，不连数据库，随便给一个合法地址即可
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 版本取自 package.json 的 packageManager 字段（pnpm@12.15.0）
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # postinstall 会执行 varlock codegen，生成各包的 src/env.ts（不需要 .env）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 生成 Prisma Client（packages/db/prisma/generated，已被 git 忽略），check-types 依赖它
      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Type check
        run: pnpm check-types

      - name: Lint and format check
        run: pnpm check
